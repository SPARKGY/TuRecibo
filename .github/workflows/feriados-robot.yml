name: Robot de feriados

# El calendario no tiene API: se raspa del panel legacy con un navegador de
# verdad. Por eso corre acá y no dentro del App Service.
#
# Semanal y no diario a propósito: los feriados de un año se publican una vez y
# casi no se mueven. Golpear el panel todos los días sería carga inútil sobre un
# sistema que no es nuestro.

on:
  schedule:
    # Lunes 07:00 UTC ≈ 04:00 en Argentina. Solo staging, tras el gate de corridas manuales.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant a actualizar."
        required: true
        type: string
      anios:
        description: "Años separados por coma. Vacío = los de la conexión, o el actual y el siguiente."
        required: false
        type: string
      enviar:
        description: "Ingestar de verdad. Sin tildar es dry-run."
        required: false
        default: false
        type: boolean

concurrency:
  group: feriados-turecibo
  cancel-in-progress: false

jobs:
  raspar:
    if: github.event_name != 'schedule' || vars.ENABLE_FERIADOS_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Instalar solo Chromium
        run: npx playwright install --with-deps chromium

      - name: Raspar e ingestar
        # Solo hace falta FERIADOS_TOKEN (y la variable MODULO_BASE_URL): el
        # robot le pide al módulo modo y credenciales del panel
        # (`GET /api/robot/conexion`). TURECIBO_USER/TURECIBO_PASSWORD quedan
        # como fallback **opcional** para tenants sin conexión en el módulo o
        # un módulo que todavía no expone esa ruta; si los secrets no existen
        # llegan vacíos y el fallback simplemente no aplica.
        env:
          MODULO_BASE_URL: ${{ vars.MODULO_BASE_URL }}
          FERIADOS_TOKEN: ${{ secrets.FERIADOS_TOKEN }}
          TURECIBO_ADMIN_URL: ${{ vars.TURECIBO_ADMIN_URL }}
          TURECIBO_USER: ${{ secrets.TURECIBO_USER }}
          TURECIBO_PASSWORD: ${{ secrets.TURECIBO_PASSWORD }}
          TENANT: ${{ inputs.tenant || vars.TENANT_POR_DEFECTO }}
          ANIOS: ${{ inputs.anios }}
        run: |
          set -euo pipefail
          # En el cron siempre se ingesta; a mano, solo si lo pidieron. El
          # default a dry-run está en el script: el modo que escribe se elige,
          # no se hereda.
          extra=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.enviar }}" = "true" ]; then
            extra="--enviar"
          fi
          # Sin --anios, el robot usa los años configurados en la conexión o,
          # si no hay, el actual y el siguiente.
          if [ -n "${ANIOS:-}" ]; then
            extra="$extra --anios $ANIOS"
          fi
          node scripts/feriados-robot.mjs --tenant "$TENANT" $extra

      - name: Guardar lo que vio el robot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: feriados-fallido
          path: |
            test-results/
          if-no-files-found: ignore
